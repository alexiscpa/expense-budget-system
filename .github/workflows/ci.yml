name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: expense_budget_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d expense_budget_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Must match vitest.config.ts's fixed test-DB env exactly - vitest
      # overrides DATABASE_URL/DIRECT_URL for the actual `npm test` run, so
      # `prisma migrate deploy` here has to target that same database or the
      # tests run against an unmigrated (or nonexistent-credential) database.
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/expense_budget_test?schema=public"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/expense_budget_test?schema=public"
      SESSION_SECRET: "ci-only-session-secret-not-used-in-production-32chars"
      NODE_ENV: "test"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma format check
        run: npx prisma format --check

      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma migrate deploy (CI test database)
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
